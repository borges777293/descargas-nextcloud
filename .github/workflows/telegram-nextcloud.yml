name: Telegram to Nextcloud

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Uno o varios enlaces de fuckingfast.co (uno por línea)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: telegram-nextcloud-download
  cancel-in-progress: false

jobs:
  download-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -c constraints.txt

      - name: Install Chromium for the provider's Turnstile fallback
        run: python -m playwright install --with-deps chromium

      - name: Prepare link list
        env:
          URLS: ${{ inputs.urls }}
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse

          raw = os.environ["URLS"]
          urls = [line.strip() for line in raw.splitlines() if line.strip()]
          if not urls:
              raise SystemExit("No se recibieron enlaces")
          invalid = []
          for url in urls:
              host = (urlparse(url).hostname or "").lower()
              if host not in {"fuckingfast.co", "www.fuckingfast.co"}:
                  invalid.append(url)
          if invalid:
              raise SystemExit("Solo se admiten enlaces de fuckingfast.co en esta primera versión")
          with open("links.txt", "w", encoding="utf-8") as f:
              f.write("\\n".join(urls) + "\\n")
          print(f"Enlaces aceptados: {len(urls)}")
          PY

      - name: Download with MoonDownloader
        id: download
        continue-on-error: true
        run: |
          python moon_cli.py --urls links.txt --output downloads --extractors 2 --streams 4 --retries 2

      - name: Upload completed files to Nextcloud
        id: upload
        if: always() && hashFiles('downloads/**') != ''
        env:
          NEXTCLOUD_URL: ${{ secrets.NEXTCLOUD_URL }}
          NEXTCLOUD_USERNAME: ${{ secrets.NEXTCLOUD_USERNAME }}
          NEXTCLOUD_APP_PASSWORD: ${{ secrets.NEXTCLOUD_APP_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          import base64
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError

          base = os.environ["NEXTCLOUD_URL"].rstrip("/") + "/"
          username = os.environ["NEXTCLOUD_USERNAME"]
          password = os.environ["NEXTCLOUD_APP_PASSWORD"]
          files = [p for p in Path("downloads").rglob("*") if p.is_file()]
          if not files:
              print("No hay archivos descargados para subir.")
              raise SystemExit(0)

          auth = base64.b64encode(f"{username}:{password}".encode()).decode()
          uploaded = 0
          errors = []
          for path in files:
              target = base + quote(path.name, safe="")
              request = Request(target, data=path.read_bytes(), method="PUT")
              request.add_header("Authorization", "Basic " + auth)
              request.add_header("Content-Type", "application/octet-stream")
              try:
                  with urlopen(request, timeout=300) as response:
                      if response.status in (200, 201, 204):
                          uploaded += 1
                          print(f"Subido: {path.name}")
                      else:
                          errors.append(f"{path.name}: HTTP {response.status}")
              except (HTTPError, URLError, TimeoutError) as exc:
                  errors.append(f"{path.name}: {exc}")

          print(f"Archivos subidos: {uploaded}/{len(files)}")
          if errors:
              print("\\n".join(errors))
              raise SystemExit(1)
          PY

      - name: Send Telegram result
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "")
          if not token or not chat_id:
              print("Faltan TELEGRAM_BOT_TOKEN o TELEGRAM_CHAT_ID; se omite el aviso.")
              raise SystemExit(0)

          download = os.environ.get("DOWNLOAD_OUTCOME", "unknown")
          upload = os.environ.get("UPLOAD_OUTCOME", "unknown")
          if download == "success" and upload in ("success", "skipped"):
              message = "✅ Proceso terminado. Descarga correcta; revisa Nextcloud."
          elif download == "success":
              message = "⚠️ Descarga terminada, pero la subida a Nextcloud no se completó correctamente."
          else:
              message = "❌ El proceso de descarga terminó con errores. Revisa el registro de GitHub Actions."

          url = f"https://api.telegram.org/bot{token}/sendMessage"
          data = json.dumps({"chat_id": chat_id, "text": message}).encode()
          req = Request(url, data=data, headers={"Content-Type": "application/json"})
          with urlopen(req, timeout=30) as response:
              print("Aviso Telegram:", response.status)
          PY
